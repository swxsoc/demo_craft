# This workflow will install Python dependencies and run tests in the docker container
# used by the SDC processing Lambda (Ubuntu 24.04, Python 3.12).
name: Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/w5r9l1c8/swxsoc-pipeline-docker-lambda-base:latest

    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Mark repo as safe for git (container workspace)
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -e '.[test]'
    - name: Run tests
      run: pytest --pyargs demo_craft --cov demo_craft
      env:
        PLATFORM: 'docker'
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
