[build-system]
requires = ["setuptools>=77",
            "setuptools_scm[toml]>=6.2",
            "wheel"]
build-backend = 'setuptools.build_meta'

[project]
name = "demo_craft"
description = "Instrument package for the craft instrument of the SWxSOC demo mission."
readme = "README.rst"
dynamic = ["version"]
authors = [{name = "James Ray", email="jamesarthurray@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
keywords = ["nasa mission", "space weather"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  'astropy>=4.1.0',
  'numpy>=1.16.0',
  'swxsoc @ git+https://github.com/swxsoc/swxsoc.git@main',
]

[project.urls]
Homepage = "https://github.com/swxsoc/demo_craft"
Repository = "https://github.com/swxsoc/demo_craft"
Issues = "https://github.com/swxsoc/demo_craft/issues"
Changelog = "https://github.com/swxsoc/demo_craft/blob/main/CHANGELOG.rst"

[project.optional-dependencies]
dev = [
  "demo_craft[docs,test,style]"
]

docs = [
  'sphinx',
  'sphinx-automodapi',
  'pydata-sphinx-theme',
]

test = [
  'pytest',
  'pytest-astropy',
  'pytest-cov',
  'coverage[toml]'
]

style = ['ruff']

[tool.setuptools.packages.find]
include = ["demo_craft*"]

[tool.setuptools.package-data]
"demo_craft.data" = ["**"]

[tool.setuptools_scm]
write_to = "demo_craft/_version.py"

[tool.pytest.ini_options]
testpaths = [
   "demo_craft/tests",
   "docs"
]
doctest_plus = "enabled"
text_file_format = "rst"
addopts = "--doctest-rst"

[tool.coverage.run]
omit = [
  'demo_craft/__init*',
  'demo_craft/conftest.py',
  'demo_craft/*setup_package*',
  'demo_craft/tests/*',
  'demo_craft/*/tests/*',
  'demo_craft/extern/*',
  'demo_craft/version*',
  '*/demo_craft/__init*',
  '*/demo_craft/conftest.py',
  '*/demo_craft/*setup_package*',
  '*/demo_craft/tests/*',
  '*/demo_craft/*/tests/*',
  '*/demo_craft/extern/*',
  '*/demo_craft/version*',
]

[tool.ruff]
line-length = 88
extend-exclude = ["demo_craft/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["E402", "E501"]
